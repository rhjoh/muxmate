[project]
name = "muxmate"
version = "0.1.0"
description = "A terminal-based AI assistant with multi-provider support"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "simple-term-menu",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
